<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 230" fill="none" role="img" aria-label="Wale-Durojaye Ayotomiwa. Interfaces that feel like something.">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="840" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff">
        <animate attributeName="stop-color" values="#58a6ff;#bc8cff;#39d2c0;#58a6ff" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#bc8cff">
        <animate attributeName="stop-color" values="#bc8cff;#39d2c0;#58a6ff;#bc8cff" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#1b2129"/>
    </pattern>
  </defs>
  <rect width="840" height="230" rx="14" fill="#0d1117"/>
  <rect width="840" height="230" rx="14" fill="url(#dots)"/>
  <rect x="0.5" y="0.5" width="839" height="229" rx="13.5" stroke="#30363d"/>
  <text x="60" y="72" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#7d8590">~/tomiwadoesux $ whoami</text>
  <rect x="276" y="59" width="9" height="17" fill="#58a6ff">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="60" y="126" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="38" font-weight="700" fill="#e6edf3">Wale-Durojaye Ayotomiwa</text>
  <text x="60" y="170" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="600" fill="url(#g)">interfaces that feel like something.</text>
  <rect x="60" y="186" width="120" height="3" rx="1.5" fill="url(#g)">
    <animate attributeName="width" values="0;380;0" dur="7s" repeatCount="indefinite"/>
  </rect>
  <g>
    <rect x="655" y="70" width="90" height="90" rx="18" stroke="#30363d" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="0 700 115" to="360 700 115" dur="26s" repeatCount="indefinite"/>
    </rect>
    <rect x="672" y="87" width="56" height="56" rx="12" stroke="#58a6ff" stroke-opacity="0.35" fill="none">
      <animateTransform attributeName="transform" type="rotate" from="360 700 115" to="0 700 115" dur="18s" repeatCount="indefinite"/>
    </rect>
    <circle cx="700" cy="52" r="4.5" fill="url(#g)">
      <animateTransform attributeName="transform" type="rotate" from="0 700 115" to="360 700 115" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
